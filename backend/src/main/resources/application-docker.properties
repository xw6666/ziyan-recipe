# Docker环境专用配置

# 数据库配置（Docker环境使用服务名）
spring.datasource.url=jdbc:mysql://mysql:3306/ziyan_recipe?useSSL=false&serverTimezone=UTC&characterEncoding=utf8mb4
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JWT配置
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# LLM API配置
llm.api.endpoint=${LLM_API_ENDPOINT}
llm.api.key=${LLM_API_KEY}

# 服务器配置
server.port=${SERVER_PORT:8080}

# 日志配置
logging.level.root=INFO
logging.level.com.ziyan.recipe=INFO
logging.file.name=/app/logs/app.log

# Actuator配置（生产环境禁用）
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true
management.endpoint.info.enabled=true

# 性能优化
spring.datasource.druid.max-active=50
spring.datasource.druid.initial-size=10
spring.datasource.druid.min-idle=10

# MyBatis Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

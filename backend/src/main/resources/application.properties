# ===========================
# 紫燕菜谱 - Spring Boot 配置
# ===========================

# 服务器配置
server.port=8080
# 保持根路径，避免与控制器上的 /api 前缀重复导致匹配异常
server.servlet.context-path=

# ===========================
# 数据库配置
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/ziyan_recipe?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=Hello=111!

# Druid连接池配置
spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.pool-prepared-statements=true
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=20

# MyBatis Plus
mybatis-plus.configuration.map-underscore-to-camel-case=true
mybatis-plus.mapper-locations=classpath:/mapper/*.xml

# ===========================
# JWT配置
# ===========================
jwt.secret=IUBz3vuT9MaScMaxubm0dBm3I9Wktzd6jROSHfdprltTNxEdJd7GdoYa8oRcYTE
jwt.expiration=86400000

# ===========================
# LLM API配置
# ===========================
llm.api.endpoint=https://api.deepseek.com/chat/completions
llm.api.key=sk-ef2b988a45fb4a30b49b848e3a7b62b1

# ===========================
# 应用配置
# ===========================
spring.application.name=ZiyanRecipe

# 日志配置
logging.level.root=INFO
logging.level.com.ziyan.recipe=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# 文件上传配置
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB

# ===========================
# 安全配置
# ===========================
# 白名单路径（不需要认证）
security.whitelist=/api/auth/**,/api/recipes,/api/recipes/**,/api/ingredients/**

# 角色配置
security.role.user=ROLE_USER
security.role.admin=ROLE_ADMIN

# ===========================
# 限流配置（可选）
# ===========================
ratelimit.enabled=true
ratelimit.login=5/1m  # 登录接口：每分钟5次
ratelimit.generate=3/1m  # 生成接口：每分钟3次

# ===========================
# CORS配置
# ===========================
cors.allowed-origins= **
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers= **
cors.allow-credentials=true

# ===========================
# 其他配置
# ===========================
# 时区配置
spring.jackson.time-zone=GMT+8
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# Actuator（监控）
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

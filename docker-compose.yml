version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ziyan-recipe-mysql
    restart: always
    environment:
      MYSQL_DATABASE: ziyan_recipe
      MYSQL_USER: ziyan_user
      MYSQL_PASSWORD: secure_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docs/init.sql:/docker-entrypoint-initdb.d/init.sql
    command:
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --lower_case_table_names=1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ziyan-recipe-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ziyan_recipe?useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ziyan_user
      SPRING_DATASOURCE_PASSWORD: secure_password
      JWT_SECRET: ziyan_recipe_jwt_secret_key_2024
      JWT_EXPIRATION: 86400000
      LLM_API_ENDPOINT: https://api.moonshot.cn/v1/chat/completions
      LLM_API_KEY: ${LLM_API_KEY:-your_llm_api_key_here}
      SERVER_PORT: 8080
    volumes:
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/auth/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: ziyan-recipe-nginx
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html
    command: ["nginx", "-g", "daemon off;"]

volumes:
  mysql_data:
    driver: local
  backend_logs:
    driver: local
  frontend_dist:
    driver: local

networks:
  default:
    driver: bridge
    name: ziyan-recipe-network